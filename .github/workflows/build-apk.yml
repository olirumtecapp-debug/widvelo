name: Build Android APK - WidVelo

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Native Kotlin APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Automated Unit Tests & Build APK
        run: |
          cd android
          gradle testDebugUnitTest --info || {
            echo "=== TEST FAILURES XML ==="
            find app/build/test-results -name "*.xml" -exec cat {} +
            exit 1
          }
          gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APK for Artifact
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          echo "Building version: $VERSION_NAME"
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/WidVelo-v${VERSION_NAME}.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/WidVelo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WidVelo-Release-APK
          path: release-apk/
          retention-days: 30

      - name: Push APK to main repo
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          cp release-apk/WidVelo-v${VERSION_NAME}.apk ./WidVelo-v${VERSION_NAME}.apk
          cp release-apk/WidVelo.apk ./WidVelo.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add WidVelo-v${VERSION_NAME}.apk WidVelo.apk
          git commit -m "chore(release): publish WidVelo-v${VERSION_NAME}.apk [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or branch protected"
